[project]
name = "vital-api"
version = "0.1.0"
description = "Vital — self-hosted biomarker and body-composition tracker (API)"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "authlib>=1.4",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "starlette>=0.47",
    "bcrypt>=4.2",
    # v1.1 extraction pipeline: LiteLLM keeps the provider an env var, PyMuPDF
    # reads the PDF, python-multipart lets FastAPI accept the upload.
    "litellm>=1.80",
    "pymupdf>=1.25",
    "python-multipart>=0.0.20",
    # Progress photos: decode, re-orient and re-encode without the metadata.
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9,<0.17",
    "mypy>=1.13",
    # Writes the EXIF the strip has to remove, so the test proves it on bytes.
    "piexif>=1.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
