name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vital
          POSTGRES_PASSWORD: vital
          POSTGRES_DB: vital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vital -d vital_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://vital:vital@localhost:5432/vital_test
      ENVIRONMENT: test
      SECRET_KEY: ci-only-not-a-real-secret
      AUTH_MODE: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy app
      - name: Migrations
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Seed catalogue
        run: python -m app.db.seed
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (eslint · stylelint · tsc · vitest · build · storybook)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Lint CSS
        run: npm run lint:css
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Build the design catalogue
        # The stories are the design system's documentation. A story that no
        # longer compiles is a component whose contract changed under it.
        run: npm run build:storybook

  e2e:
    name: E2E (Playwright · axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Before the stack starts: the web container mounts ./frontend with a named
      # volume shadowing its own node_modules, and to attach that volume Docker
      # creates the mount point on the host first, as root, if it doesn't already
      # exist. Installing here first means it already exists — owned by the
      # runner — before Docker ever needs to create it.
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start the stack
        # The suite runs against the real API: the flags it asserts are computed
        # server-side, so a mocked one would only be testing the fixtures.
        run: |
          docker compose -f docker-compose.dev.yml up -d --build
          for _ in $(seq 1 60); do
            if curl -sf localhost:8000/api/health && curl -sf localhost:5173 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.dev.yml logs
          exit 1
      - name: Run
        working-directory: frontend
        run: npx playwright test --grep-invert '@shots|@pwa'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  seed:
    name: Seed catalogue (schema · bands)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate seed catalogue
        run: python scripts/validate_seed.py
